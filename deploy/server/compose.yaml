name: plz-map-server

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plz_map
      POSTGRES_USER: plz_map
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plz_map -d plz_map"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://plz_map:${POSTGRES_PASSWORD}@database:5432/plz_map
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../../src/app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
