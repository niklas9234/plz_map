<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PLZ Karte Deutschland</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header id="desktop-titlebar" class="desktop-titlebar" aria-label="Fensterleiste" hidden>
    <div class="desktop-titlebar__drag pywebview-drag-region">
      <img src="/PLZ-Karte.ico" alt="" width="18" height="18">
      <span>PLZ-Karte</span>
    </div>
    <div class="desktop-titlebar__actions">
      <button id="window-minimize" type="button" aria-label="Fenster minimieren">&#x2212;</button>
      <button id="window-maximize" type="button" aria-label="Fenster maximieren">&#x25A1;</button>
      <button id="window-close" class="desktop-titlebar__close" type="button" aria-label="Fenster schließen">&#x2715;</button>
    </div>
  </header>
  <div id="desktop-titlebar-trigger" class="desktop-titlebar-trigger" aria-hidden="true" hidden></div>

  <section class="company-search" aria-labelledby="company-search-title">
    <div class="company-search__heading">
      <div class="search-tabs" role="tablist" aria-label="Suchart auswählen">
        <button id="company-search-tab" class="search-tabs__tab is-active" type="button" role="tab"
          aria-selected="true" aria-controls="company-search-panel">Unternehmen suchen</button>
        <button id="area-search-tab" class="search-tabs__tab" type="button" role="tab"
          aria-selected="false" aria-controls="area-search-panel">Gebiete suchen</button>
      </div>
      <button id="open-company-management" class="button button--secondary" type="button">Verwalten</button>
    </div>
    <h1 id="company-search-title" class="visually-hidden">Partnersuche</h1>
    <div id="company-search-panel" role="tabpanel" aria-labelledby="company-search-tab">
      <div class="company-search__controls" role="search">
        <input id="company-search-input" type="text" autocomplete="off" autofocus
          placeholder="Name oder PPS-Nummer" aria-label="Name oder PPS-Nummer"
          aria-autocomplete="list" aria-controls="company-suggestions" aria-expanded="false">
        <ul id="company-suggestions" class="company-search__suggestions" role="listbox" hidden></ul>
      </div>
      <div id="company-search-status" class="company-search__status" role="status" aria-live="polite"></div>
    </div>
    <div id="area-search-panel" role="tabpanel" aria-labelledby="area-search-tab" hidden>
      <div class="area-search__controls" role="search">
        <label class="visually-hidden" for="area-postal-code">PLZ-Gebiet</label>
        <input id="area-postal-code" type="text" inputmode="text" autocomplete="postal-code"
          autocapitalize="characters" maxlength="3" placeholder="PLZ-Gebiet (z. B. 08 oder LUX)">
        <label class="visually-hidden" for="area-trade">Gewerk</label>
        <select id="area-trade"><option value="">Gewerk auswählen</option></select>
      </div>
      <div id="area-search-results" class="area-search__results" role="status" aria-live="polite"></div>
    </div>
  </section>

  <div id="map"></div>

  <dialog id="company-management" class="management-dialog" aria-labelledby="management-title">
    <div class="management-dialog__header">
      <div>
        <p class="eyebrow">Stammdaten</p>
        <h2 id="management-title">Unternehmen verwalten</h2>
      </div>
      <div class="management-dialog__header-actions">
        <a id="export-master-data" class="button button--secondary" href="/api/admin/export" download>Daten exportieren</a>
        <button id="create-company" class="button button--primary" type="button">+ Neues Unternehmen</button>
        <button id="open-trade-management" class="button button--secondary" type="button">Gewerkedaten</button>
        <button id="close-company-management" class="icon-button" type="button" aria-label="Verwaltung schließen">&times;</button>
      </div>
    </div>

    <div class="management-toolbar">
      <label class="form-field management-toolbar__search">
        <span>Unternehmen suchen</span>
        <input id="management-search" type="search" placeholder="Name oder PPS-Nummer" autocomplete="off">
      </label>
      <label class="form-field">
        <span>Gewerk</span>
        <select id="management-trade-filter">
          <option value="">Alle Gewerke</option>
        </select>
      </label>
    </div>

    <p id="management-result-status" class="management-result-status" role="status" aria-live="polite"></p>
    <div class="company-table-wrapper">
      <table class="company-table">
        <colgroup>
          <col class="company-table__column--company">
          <col class="company-table__column--trade">
          <col class="company-table__column--pps">
          <col class="company-table__column--postal-codes">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Unternehmen</th>
            <th scope="col">Gewerk</th>
            <th scope="col">PPS-Nummer</th>
            <th scope="col">PLZ-Gebiete</th>
          </tr>
        </thead>
        <tbody id="company-table-body"></tbody>
      </table>
    </div>
  </dialog>

  <dialog id="trade-management" class="management-dialog trade-dialog" aria-labelledby="trade-title">
    <div class="management-dialog__header">
      <div><p class="eyebrow">Stammdaten</p><h2 id="trade-title">Gewerkedaten verwalten</h2></div>
      <button id="close-trade-management" class="icon-button" type="button" aria-label="Gewerkedaten schließen">&times;</button>
    </div>
    <form id="trade-form" class="trade-form">
      <label class="form-field"><span>Neues Gewerk</span><input id="trade-name" required maxlength="80" placeholder="Name des Gewerks"></label>
      <div id="new-trade-color-picker" class="color-picker"></div>
      <button class="button button--primary" type="submit">Hinzufügen</button>
    </form>
    <p id="trade-error" class="form-error trade-error" role="alert" hidden></p>
    <ul id="trade-list" class="trade-list"></ul>
  </dialog>

  <dialog id="delete-company-confirmation" class="confirm-dialog" aria-labelledby="delete-company-title" aria-describedby="delete-company-description">
    <h2 id="delete-company-title">Unternehmen löschen?</h2>
    <p id="delete-company-description">Möchten Sie <strong id="delete-company-name"></strong> wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.</p>
    <div class="dialog-actions">
      <button id="cancel-company-delete" class="button button--secondary" type="button">Abbrechen</button>
      <button id="confirm-company-delete" class="button button--danger" type="button">Unternehmen löschen</button>
    </div>
  </dialog>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>

<script src="settings.js"></script>
<script src="basemap.js"></script>
<script src="plz-layer.js"></script>
<script src="lux-layer.js"></script>
<script src="company-store.js"></script>
<script src="trade-store.js"></script>
<script src="company-search.js"></script>
<script src="area-search.js"></script>
<script src="company-management.js"></script>
<script src="map.js"></script>
<script src="titlebar.js"></script>
</body>

</html>
