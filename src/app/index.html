<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PLZ Karte Deutschland</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="company-search" aria-labelledby="company-search-title">
    <h1 id="company-search-title">Unternehmen suchen</h1>
    <form id="company-search-form" role="search">
      <label for="company-search-input">Name oder PPS-Nummer</label>
      <div class="company-search__controls">
        <input id="company-search-input" list="company-suggestions" autocomplete="off"
          placeholder="z. B. Nordlicht Logistik oder PPS-1001" required>
        <datalist id="company-suggestions"></datalist>
        <button type="submit">Suchen</button>
        <button id="company-search-reset" class="company-search__reset" type="button">Zurücksetzen</button>
      </div>
    </form>
    <p id="company-search-status" class="company-search__status" aria-live="polite">
      Testunternehmen werden geladen …
    </p>
  </section>

  <div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>

<script src="settings.js"></script>
<script src="basemap.js"></script>
<script src="plz-layer.js"></script>
<script src="lux-layer.js"></script>
<script src="company-search.js"></script>
<script src="map.js"></script>
</body>

</html>
