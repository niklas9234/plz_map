name: PostgreSQL transfer integration test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  transfer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plz_map_test
          POSTGRES_USER: plz_map
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plz_map -d plz_map_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRESQL_URL: postgresql+psycopg://plz_map:test-password@localhost:5432/plz_map_test
      PYTHONPATH: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt pytest
      - run: pytest server/tests/test_transfer.py server/tests/test_api_databases.py
