name: Windows release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (must match the intended tag)"
        required: true

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      PLZ_MAP_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            packaging/windows/requirements-build.txt
      - name: Import signing certificate
        if: ${{ env.CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP signing.pfx
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "WINDOWS_SIGNING_CERTIFICATE=$certificate" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Publish installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: PLZ-Karte-${{ env.PLZ_MAP_VERSION }}-Windows
          path: |
            dist-installer/*.exe
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error
